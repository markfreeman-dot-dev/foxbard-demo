[program:docker]
command=/usr/sbin/dockerd --host=unix:///var/run/docker.sock --group=neko
user=root
autorestart=true
startsecs=3
stopwaitsecs=15
priority=850
stdout_logfile=/var/log/neko/docker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true

[program:hermes-chat]
command=/usr/bin/python3 /opt/foxbard/hermes-chat.py
user=neko
environment=HOME="/home/neko",USER="neko",DISPLAY=":99.0",LANG="C.UTF-8",PATH="/home/neko/.local/bin:/usr/local/bin:/usr/bin:/bin"
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
priority=900
stdout_logfile=/var/log/neko/hermes-chat.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
