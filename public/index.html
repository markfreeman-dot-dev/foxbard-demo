<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Foxbard</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Foxbard</h1>
    <section class="card">
      <form id="login" aria-label="Log in">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="nickname" maxlength="40" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Log in</button>
      </form>
      <div id="workspace" hidden>
        <div class="status"><span class="dot"></span><span id="state">Checking desktop…</span></div>
        <h2 id="welcome">Welcome back</h2>
        <button id="launch">Open desktop <span aria-hidden="true">↗</span></button>
        <div class="actions">
          <button class="secondary" id="stop">Stop shared desktop</button>
          <button class="secondary" id="logout">Log out</button>
        </div>
        <p class="note">Stopping disconnects everyone. Save open work first.</p>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
